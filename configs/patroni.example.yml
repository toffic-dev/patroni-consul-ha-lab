# Sanitized Patroni configuration example
# Replace node-specific values and credentials before use.

scope: patroni-lab
namespace: /service/

name: patroni1

restapi:
  listen: 0.0.0.0:8008
  connect_address: 192.168.116.129:8008

consul:
  host: 127.0.0.1:8500
  register_service: true

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576

    postgresql:
      use_pg_rewind: true
      use_slots: true
      parameters:
        wal_level: replica
        hot_standby: "on"
        wal_log_hints: "on"
        max_wal_senders: 5
        max_replication_slots: 5

  initdb:
    - encoding: UTF8
    - data-checksums

  pg_hba:
    - local all postgres peer
    - host all all 127.0.0.1/32 scram-sha-256
    - host all all ::1/128 scram-sha-256
    - host replication replicator 192.168.116.0/24 scram-sha-256

  users:
    replicator:
      password: "REPLACE_WITH_STRONG_REPLICATION_PASSWORD"
      options:
        - replication
        - login

postgresql:
  listen: 0.0.0.0:5432
  connect_address: 192.168.116.129:5432
  data_dir: /var/lib/postgresql/18/patroni
  bin_dir: /usr/lib/postgresql/18/bin

  authentication:
    superuser:
      username: postgres
      password: "REPLACE_WITH_STRONG_POSTGRES_PASSWORD"
    replication:
      username: replicator
      password: "REPLACE_WITH_STRONG_REPLICATION_PASSWORD"

  parameters:
    unix_socket_directories: /var/run/postgresql

# IMPORTANT:
# This is an example for patroni1 only.
# For patroni2 and patroni3, change:
# - name
# - restapi.connect_address
# - postgresql.connect_address
#
# Never commit real passwords or production credentials.